[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-rl-conflict"
version = "0.1.0"
description = "Continual Reinforcement Learning Under Task Conflict: Replay, Regularization, and Spectral Orthogonality"
readme = "README.md"
authors = [
    { name = "Bhavya Gupta", email = "f20230494@pilani.bits-pilani.ac.in" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "gymnasium>=1.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]

